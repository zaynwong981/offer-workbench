<!doctype html>
<html lang="zh-CN" data-type="software">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简历工作台 · Offer Workbench</title>
  <link rel="stylesheet" href="/style.css">
<meta name="page-type" content="software"><meta name="site-kind" content="software"><meta name="theme-color" content="#245bcc"><meta name="description" content="在本机管理多方向简历、求职机会和税后收入测算。"><link rel="stylesheet" href="/studio.css"><link rel="icon" href="/brand/favicon.ico"><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/assistant.css"></head>
<body class="resume-page">
<a class="skip-link" href="#main-content">跳到内容</a>
<header class="topbar"><a class="brand" href="/career"><img class="brand-wordmark" src="/brand/wordmark.svg" alt="Offer Workbench" width="206" height="36"></a><nav aria-label="主导航"><a href="/" class="selected" aria-current="page">简历工作台</a><a id="career-link" href="/career">求职工作台</a></nav><div class="topbar-right"><span class="local-badge"><i></i>本机保存</span><a class="help-link" href="/guide" target="_blank" rel="noopener" aria-label="使用指引（在新标签页打开）">使用指引 ↗</a></div></header>
  <aside class="sidebar">
    <div class="nav-caption">个人资料</div>
    <button id="common-nav" class="nav-item">个人资料与教育 <span>共用</span></button>
    <div class="nav-caption versions-caption">我的简历 <button id="duplicate-nav" title="复制当前简历创建版本" aria-label="复制当前简历创建版本">＋</button></div>
    <label class="version-search"><span class="sr-only">搜索简历名称</span><input id="version-search" placeholder="搜索简历名称"></label><label class="version-filter"><select id="version-filter" aria-label="简历分类"><option value="active">正在使用</option><option value="master">方向母版</option><option value="job">岗位草稿</option><option value="archived">已归档</option><option value="all">全部版本</option></select></label><nav id="versions" aria-label="简历方向"></nav>
    <div class="sidebar-bottom">
      <button id="export-all" class="secondary full">打包导出在用 PDF</button>
      <div class="backup-actions"><button id="backup">下载备份</button><button id="import">导入备份</button></div>
      <input id="import-file" type="file" accept=".json,application/json" hidden>

    </div>
  </aside>
  <div class="workspace">
    <header class="toolbar">
      <div><div class="eyebrow">编辑与预览</div><h1 id="page-title">正在读取简历…</h1></div>
      <div class="toolbar-actions"><span id="save-status" role="status">读取中</span><button id="retry-save" hidden>重试保存</button><button id="toggle-preview" class="secondary">查看预览</button><button id="download" class="primary">导出 PDF <span>↗</span></button></div>
    </header>
    <div id="error" role="alert" hidden></div>
    <div id="recovery" role="status" hidden><p id="recovery-message">发现上次尚未保存的编辑内容。</p><div class="recovery-actions"><button id="download-draft" class="secondary">下载完整草稿备份</button><button id="recover-draft" class="primary">恢复编辑</button><button id="discard-draft">使用已保存内容</button></div></div>
    <main class="panels" id="main-content">
      <section class="editor-pane" aria-label="简历内容编辑">
        <div id="editor"></div>
      </section>
      <div id="panel-divider" class="panel-divider" role="separator" tabindex="0" aria-label="调整编辑区与 PDF 预览宽度；方向键调整，回车恢复均分" aria-orientation="vertical" aria-controls="editor pdf-preview"></div>
      <section class="preview-pane" aria-label="PDF 预览">
        <div class="preview-toolbar"><div><span class="preview-dot"></span>PDF 预览 <small id="preview-version"></small></div><span id="page-meta">正在排版</span></div>
        <div id="overflow-warning" hidden>当前内容超过一页，可精简文字或调小字号。导出将保留完整内容。</div>
        <div id="pdf-preview" role="img" aria-label="当前简历 PDF 预览"></div>
        <div class="preview-footer"><span>A4 · 中文字体嵌入</span><span>预览与导出使用相同 PDF 排版</span></div>
      </section>
    </main>
  </div>
  <div id="toast" role="status" hidden></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2><p id="dialog-message"></p>
      <label id="dialog-input-label">版本名称<input id="dialog-input" maxlength="200"></label>
      <div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button value="accept" class="primary">确认</button></div>
    </form>
  </dialog>
  <script src="/ui.js"></script><script src="/photo-crop.js"></script>
  <script src="/ai-analysis.js"></script><script src="/inline-ai.js"></script><script src="/assistant-ui.js"></script><script src="/app.js"></script>
<script src="/workspace-layout.js"></script><footer class="app-footer" aria-label="版本与开发信息"><span data-build-info>Offer Workbench</span></footer><script src="/site-info.js"></script></body>
</html>
