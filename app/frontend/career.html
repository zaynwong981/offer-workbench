<!doctype html>
<html lang="zh-CN" data-type="software">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>求职工作台 · Offer Workbench</title><link rel="stylesheet" href="/career.css"><link rel="stylesheet" href="/salary.css"><link rel="stylesheet" href="/calendar.css"><meta name="page-type" content="software"><meta name="site-kind" content="software"><meta name="theme-color" content="#245bcc"><meta name="description" content="在本机管理多方向简历、求职机会和税后收入测算。"><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/job-workflow.css"><link rel="stylesheet" href="/assistant.css"><link rel="icon" href="/brand/favicon.ico"><link rel="stylesheet" href="/brand.css"></head>
<body>
<a class="skip-link" href="#main-content">跳到内容</a>
<header class="topbar"><a class="brand" href="/career"><img class="brand-wordmark" src="/brand/wordmark.svg" alt="Offer Workbench" width="206" height="36"></a><nav aria-label="主导航"><a href="/">简历工作台</a><a href="/career" class="selected" aria-current="page">求职工作台</a></nav><div class="topbar-right"><span class="local-badge"><i></i>本机保存</span><a class="help-link" href="/guide" target="_blank" rel="noopener" aria-label="使用指引（在新标签页打开）">使用指引 ↗</a></div></header>
<div class="shell"><aside class="rail"><nav id="sections" aria-label="求职功能"><button data-tab="overview" class="active">工作台 <span>01</span></button><button data-tab="search">找岗位 <span>02</span></button><button data-tab="pipeline">机会管理 <span>03</span></button><button data-tab="calendar">求职日历 <span>04</span></button><button data-tab="salary">薪酬与个税 <span>05</span></button><button data-tab="preferences">偏好与设置 <span>06</span></button></nav><div class="backup-actions"><button id="backup">导出求职备份</button><button id="restore">导入备份</button><input id="backup-file" type="file" accept=".json,application/json" hidden></div></aside>
<main id="main-content"><div class="page-heading"><div><h1 id="title">让每个机会都有下一步</h1><p id="subtitle">从筛选到准备，在一个地方完成。</p></div><button class="primary" id="manual-add">＋ 手动添加岗位</button></div><div id="error" class="error-banner" role="alert" hidden></div><div id="content" aria-live="polite"><div class="empty">正在读取本机资料…</div></div></main></div>
<div id="toast" role="status" hidden></div>
<dialog id="job-dialog" class="job-dialog"><div class="dialog-top"><span class="eyebrow">OPPORTUNITY DETAILS</span><button data-close="job-dialog" aria-label="关闭岗位详情">×</button></div><div id="job-detail"></div></dialog>
<dialog id="manual-dialog"><form id="manual-form"><div class="dialog-top"><h2 id="manual-title">添加一个真实机会</h2><button type="button" data-close="manual-dialog" aria-label="关闭">×</button></div><p class="hint" id="manual-note">复制招聘页面中的职位描述即可；无需先连接 BOSS。</p><div id="manual-error" class="error-banner" role="alert" hidden></div><div class="form-grid"><label>岗位名称 <input name="title" maxlength="200" placeholder="例如：产品经理（SaaS）"></label><label>公司名称 <input name="company" maxlength="200"></label><label>薪资范围 <input name="salary" maxlength="100" placeholder="例如：20–30K·14薪；未知可留空"></label><label>城市 <input name="city" maxlength="100" placeholder="深圳"></label><label class="wide">办公地址 <input name="address" maxlength="500"></label><label class="wide">原始链接 <input name="url" type="url" maxlength="2000" placeholder="https://…"></label><label class="wide">职位描述 <textarea name="description" rows="8" maxlength="30000" placeholder="岗位职责、任职要求、福利与其他信息"></textarea></label></div><div class="dialog-actions"><button type="button" class="secondary" data-close="manual-dialog">取消</button><button class="primary" type="submit" id="manual-submit">保存到机会池</button></div></form></dialog>
<dialog id="confirm-dialog"><div class="dialog-top"><h2 id="confirm-title"></h2></div><p id="confirm-message"></p><form method="dialog" class="dialog-actions"><button value="cancel" class="secondary">取消</button><button value="yes" class="primary">确认</button></form></dialog>
<script src="/site-info.js"></script><script src="/ui.js"></script>
<script src="/salary-engine.js"></script>
<script src="/salary-job.js"></script>
<script src="/salary-ui.js"></script>
<script src="/calendar-ui.js"></script>
<script src="/ai-analysis.js"></script><script src="/inline-ai.js"></script><script src="/assistant-ui.js"></script><script src="/career.js"></script>
<script src="/job-rules.js"></script>
<script src="/job-workflow.js"></script>
<script src="/workspace-layout.js"></script><footer class="app-footer" aria-label="版本与开发信息"><span data-build-info>Offer Workbench</span></footer></body></html>
