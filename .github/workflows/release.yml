name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_editor_state.js
      - run: node --test tests/test_career_ui.js tests/test_salary_engine.js tests/test_salary_ui.js tests/test_salary_job.js tests/test_photo_crop.js tests/test_job_rules.js tests/test_ai_analysis.js
      - run: python scripts/privacy_check.py
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: python scripts/privacy_check.py
      - run: python scripts/package_source.py
      - run: cd dist && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --title "OfferWorkbench $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
