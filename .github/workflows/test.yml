name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/test_editor_state.js
      - run: node --test tests/test_career_ui.js tests/test_salary_engine.js tests/test_salary_ui.js tests/test_salary_job.js tests/test_photo_crop.js tests/test_job_rules.js
      - run: python scripts/privacy_check.py
      - run: python scripts/package_source.py
